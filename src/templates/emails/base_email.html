<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ email_title|default:"MotionMate" }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f6f8fb; color:#1f2933; font-family:Arial, sans-serif; line-height:1.5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fb; margin:0; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#ffffff; border:1px solid #dde3ea;">
            <tr>
              <td style="padding:24px 28px 12px;">
                <div style="font-size:18px; font-weight:700; color:#0f172a;">MotionMate</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 24px;">
                <h1 style="font-size:20px; line-height:1.3; margin:0 0 16px; color:#0f172a;">{{ email_title|default:"MotionMate" }}</h1>
                {% block body %}{% endblock %}
                {% if action_url and action_label %}
                  <p style="margin:24px 0;">
                    <a href="{{ action_url }}" style="display:inline-block; background:#2563eb; color:#ffffff; text-decoration:none; padding:10px 16px; border-radius:4px;">{{ action_label }}</a>
                  </p>
                {% endif %}
                {% if support_email %}
                  <p style="font-size:13px; color:#64748b; margin:24px 0 0;">Support: {{ support_email }}</p>
                {% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
