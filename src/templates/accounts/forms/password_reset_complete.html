{% extends 'inheritance/authentication_parent.html' %}
{% load static %}

{% block content %}
<div class="container">
  <div class="row flex-center min-vh-100 py-5">
    <div class="col-sm-10 col-md-8 col-lg-5 col-xl-5 col-xxl-4">
      <a class="d-flex flex-center text-decoration-none mb-4" href="{% url 'home' %}">
        {% include "includes/motionmate_logo.html" %}
      </a>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-sm-5 text-center">
          <h3 class="text-body-highlight mb-3">Password updated</h3>
          <p class="text-body-tertiary mb-4">Your Motionmate password has been reset. You can now sign in with the new password.</p>
          <a class="btn btn-primary w-100" href="{% url 'business_login' %}">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
