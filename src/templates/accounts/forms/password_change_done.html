{% extends 'inheritance/dashboard_parent.html' %}

    <div class="col-lg-8">
      <h2 class="mb-2 text-body-emphasis">Password Changed</h2>
      <p class="text-body-tertiary mb-0">Your Motionmate account password has been updated.</p>

{% endblock %}
