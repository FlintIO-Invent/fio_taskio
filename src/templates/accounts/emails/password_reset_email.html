<!DOCTYPE html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
    <h2 style="margin-bottom: 12px;">Motionmate password reset</h2>
    <p>Hello {{ user.first_name|default:user.email }},</p>
    <p>We received a request to reset the password for your Motionmate workspace login.</p>
    <p>
      <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display: inline-block; padding: 10px 16px; background-color: #2c7be5; color: #fff; text-decoration: none; border-radius: 4px;">
        Reset password
      </a>
    </p>
    <p>If you did not request this change, you can ignore this email and keep using your current password.</p>
    <p>Motionmate</p>
  </body>
</html>
