{% load services_bookings %}
<div class="mm-sb-field">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check">{% booking_widget field %}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %} <span class="mm-sb-required">(required)</span>{% endif %}</label>
    {% booking_widget field %}
  {% endif %}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block" id="{{ field.auto_id }}_errors">{{ field.errors }}</div>{% endif %}
</div>
