{% if form.errors %}
<div class="alert alert-danger mm-sb-errors" role="alert" tabindex="-1" data-booking-error-summary>
  <h2>Check the details below</h2>
  {{ form.non_field_errors }}
  <ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul>
</div>
{% endif %}
