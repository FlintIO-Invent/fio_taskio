{% if module_capabilities.services %}<div class="manual-service-options save-service{% if line.service_id %} d-none{% endif %}"><input type="hidden" class="manual-service-action" name="{{ field_prefix }}save_as_service" value="{% if line.save_as_service %}1{% endif %}" {% if disabled %}disabled{% endif %}><label class="check-row"><input type="checkbox" class="manual-service-action-toggle" {% if line.save_as_service %}checked{% endif %} {% if disabled %}disabled{% endif %}>Save to services</label><div class="line-fields"><div class="manual-service-category-fields{% if not line.save_as_service %} d-none{% endif %}"><label class="form-label">Service category<select class="form-select" name="{{ field_prefix }}service_category_id" {% if disabled %}disabled{% endif %}><option value="">Uncategorized</option>{% for category in service_categories %}<option value="{{ category.id }}"{% if line.service_category_id|stringformat:'s' == category.id|stringformat:'s' %} selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label></div><div class="manual-service-category-fields{% if not line.save_as_service %} d-none{% endif %}"><label class="form-label">New category<input class="form-control" name="{{ field_prefix }}new_service_category_name" value="{{ line.new_service_category_name }}" maxlength="120" placeholder="Optional new category" {% if disabled %}disabled{% endif %}></label><p class="field-help">Enter a new category instead of selecting an existing one.</p></div></div></div>{% endif %}
