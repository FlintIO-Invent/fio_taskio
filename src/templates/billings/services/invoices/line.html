{% load money %}
<fieldset {% if disabled %}id="line-item-template" hidden{% endif %} class="line-item line-editor" data-line-prefix="{{ field_prefix }}"><legend>Invoice line</legend><div class="line-heading"><span class="supporting">Service and pricing</span><button type="button" class="btn btn-outline-danger" data-remove-line aria-label="Remove invoice line">Remove</button></div>
{% if existing %}<input type="hidden" name="line_id" value="{{ line.line_id }}">{% endif %}
<div class="line-fields">{% if module_capabilities.services %}<div class="wide"><label class="form-label">Service type<select class="form-select service-source-select" {% if disabled %}disabled{% endif %}><option value="custom"{% if not line.service_id %} selected{% endif %}>New service</option><option value="saved"{% if line.service_id %} selected{% endif %}>Saved service</option></select></label></div><div class="saved-service-fields wide"><label class="form-label">Saved service<select class="form-select service-select" name="{{ field_prefix }}service_id" {% if disabled %}disabled{% endif %}><option value="">Select a saved service</option>{% for service in available_services %}<option value="{{ service.id }}" data-name="{{ service.name }}" data-description="{{ service.description|default:service.name }}" data-unit-price="{{ service.unit_price }}" data-tax-rate="{{ service.tax_rate }}"{% if line.service_id|stringformat:'s' == service.id|stringformat:'s' %} selected{% endif %}>{{ service.name }} - {% if invoice %}{{ service.unit_price|money:invoice.billing_business }}{% else %}{{ service.unit_price|money:current_business }}{% endif %}</option>{% endfor %}</select></label></div>{% endif %}
<div class="wide"><label class="form-label"><span class="service-description-label">{% if module_capabilities.services %}Service name{% else %}Description{% endif %}</span><input class="form-control" name="{{ field_prefix }}description" value="{{ line.description }}" maxlength="255" {% if not invoice %}required{% endif %} {% if disabled %}disabled{% endif %}></label></div>
<div><label class="form-label">Quantity<input type="number" class="form-control" name="{{ field_prefix }}quantity" value="{{ line.quantity }}" step="1.00" min="1.00" inputmode="numeric" {% if not invoice or existing or disabled %}required{% endif %} {% if disabled %}disabled{% endif %}></label></div><div><label class="form-label">Unit Price<input type="number" class="form-control" name="{{ field_prefix }}unit_price" value="{{ line.unit_price }}" step="1.00" min="0" {% if not invoice or existing or disabled %}required{% endif %} {% if disabled %}disabled{% endif %}></label></div></div>
{% include 'billings/services/invoices/manual_service_fields.html' %}
<div class="line-total"><label class="form-label">Line Total<input class="form-control line-total-display" type="text" value="{% if invoice %}{{ 0|money:invoice.billing_business }}{% else %}{{ 0|money:current_business }}{% endif %}" readonly {% if disabled %}disabled{% endif %}></label></div></fieldset>
